<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat with AI - AI Testing Assistant</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/chat.css">
</head>
<body>
  <!-- Navbar -->
  <header class="navbar">
    <a href="dashboard.html" class="nav-brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
      </svg>
      <span>AI <span class="brand-badge">Testing Assistant</span></span>
    </a>
    <div class="nav-actions" id="nav-user-info"></div>
  </header>

  <main class="container">
    <div class="chat-layout">
      <!-- Chat Header -->
      <div class="chat-header">
        <div class="chat-title-group">
          <div class="chat-bot-avatar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="10" rx="2"></rect>
              <circle cx="12" cy="5" r="2"></circle>
              <path d="M12 7v4"></path>
              <line x1="8" y1="16" x2="8" y2="16"></line>
              <line x1="16" y1="16" x2="16" y2="16"></line>
            </svg>
          </div>
          <div>
            <h2 style="font-size: 1.1rem; font-weight: 600;" id="chat-project-name">Project AI Assistant</h2>
            <p style="font-size: 0.8rem; color: var(--status-success);">● Active Context</p>
          </div>
        </div>

        <div style="display: flex; gap: 0.75rem;">
          <a href="#" id="chat-back-btn" class="btn btn-secondary" style="padding: 0.45rem 0.85rem; font-size: 0.85rem;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <span>Back to Files</span>
          </a>
        </div>
      </div>

      <!-- Messages Body -->
      <div class="chat-body" id="chat-messages-container">
        <div style="text-align: center; padding: 2rem; color: var(--text-muted);">
          <span class="spinner" style="color: var(--primary);"></span>
          <p style="margin-top: 0.5rem;">Loading conversation history...</p>
        </div>
      </div>

      <!-- Footer Input Form -->
      <div class="chat-footer">
        <form id="chat-form" class="chat-input-form">
          <input type="text" id="chat-message-input" class="chat-input-field" placeholder="Ask about test cases, security fixes, or code improvements..." autocomplete="off">
          <button type="submit" class="btn btn-primary chat-send-btn" id="chat-send-btn" title="Send message">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </form>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
