<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Software Testing Assistant</title>
  <link rel="stylesheet" href="css/common.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; height: 100vh;">
  <div style="text-align: center;">
    <div class="spinner" style="width: 2.5rem; height: 2.5rem; margin-bottom: 1rem; color: var(--primary);"></div>
    <p style="color: var(--text-secondary);">Initializing AI Testing Assistant...</p>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    if (Auth.isAuthenticated()) {
      window.location.replace('dashboard.html');
    } else {
      window.location.replace('login.html');
    }
  </script>
</body>
</html>
