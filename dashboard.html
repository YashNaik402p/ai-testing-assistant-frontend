<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - AI Testing Assistant</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <!-- Navbar -->
  <header class="navbar">
    <a href="dashboard.html" class="nav-brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
      </svg>
      <span>AI <span class="brand-badge">Testing Assistant</span></span>
    </a>
    <div class="nav-actions" id="nav-user-info">
      <!-- Injected by auth.js -->
    </div>
  </header>

  <!-- Main Container -->
  <main class="container">
    <div class="dashboard-header">
      <div class="dashboard-title-area">
        <h1>Projects Dashboard</h1>
        <p>Manage code projects, automated test suites, and security analysis</p>
      </div>
      <button class="btn btn-primary" id="open-create-modal-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>Create New Project</span>
      </button>
    </div>

    <!-- Quick Stats -->
    <section class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          </svg>
        </div>
        <div class="stat-info">
          <div class="stat-value" id="stat-total-projects">0</div>
          <div class="stat-label">Total Projects</div>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon" style="color: var(--status-success);">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
        </div>
        <div class="stat-info">
          <div class="stat-value" id="stat-analyzed-projects">0</div>
          <div class="stat-label">Analyzed Projects</div>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon" style="color: var(--accent-cyan);">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
          </svg>
        </div>
        <div class="stat-info">
          <div class="stat-value" id="stat-supported-langs">10+</div>
          <div class="stat-label">Languages Supported</div>
        </div>
      </div>
    </section>

    <!-- Projects List Header -->
    <div class="projects-header">
      <h2>Recent Projects</h2>
      <div class="search-bar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted);">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="project-search" placeholder="Search projects...">
      </div>
    </div>

    <!-- Projects Grid Container -->
    <div id="projects-grid" class="projects-grid">
      <div style="grid-column: 1 / -1; text-align: center; padding: 3rem;">
        <span class="spinner" style="color: var(--primary);"></span>
        <p style="color: var(--text-muted); margin-top: 0.5rem;">Loading your projects...</p>
      </div>
    </div>
  </main>

  <!-- Create Project Modal -->
  <div class="modal-backdrop" id="create-project-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="card-title">Create New Project</h3>
        <button type="button" class="modal-close" id="close-modal-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <form id="create-project-form">
        <div class="form-group">
          <label class="form-label" for="project-name">Project Name *</label>
          <input type="text" id="project-name" class="form-input" placeholder="e.g. User Authentication Service" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="project-language">Primary Language / Tech *</label>
          <select id="project-language" class="form-select" required>
            <option value="Python">Python</option>
            <option value="JavaScript">JavaScript</option>
            <option value="TypeScript">TypeScript</option>
            <option value="Java">Java</option>
            <option value="C++">C++</option>
            <option value="C#">C#</option>
            <option value="Go">Go</option>
            <option value="Ruby">Ruby</option>
            <option value="PHP">PHP</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="project-desc">Description (Optional)</label>
          <textarea id="project-desc" class="form-textarea" placeholder="Brief overview of this code or microservice..." rows="3"></textarea>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
          <button type="button" class="btn btn-secondary" id="cancel-modal-btn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="save-project-btn">
            <span>Create Project</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
